{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<h1>Đăng nhập</h1>
<form method="post" action="/auth/login" class="card form">
  <input type="hidden" name="_csrf" value="{{ csrf_token(request) }}">
  <input type="hidden" name="next_path" value="{{ next_path or next or '/me' }}">
  <label>Email
    <input type="email" name="email" required autocomplete="email" value="{{ email or '' }}">
  </label>
  <label>Mật khẩu
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button type="submit">Đăng nhập</button>
</form>
<p class="muted">Chưa có tài khoản? <a href="/auth/register">Đăng ký bằng mã lớp</a></p>
{% endblock %}
